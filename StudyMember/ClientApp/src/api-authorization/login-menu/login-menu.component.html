<ul class="navbar-nav" *ngIf="isAuthenticated | async">
    <li class="nav-item">
        <a  class="nav-link text-white" [routerLink]='["/authentication/profile"]' title="Gerenciar">Olá {{ userName | async }}</a>
    </li>
    <li class="nav-item">
        <a  class="nav-link text-white" [routerLink]='["/authentication/logout"]' [state]='{ local: true }' title="Logout">Sair</a>
    </li>
</ul>
<ul class="navbar-nav" *ngIf="(isAuthenticated | async) !== true">
  <li class="nav-item">
        <a class="nav-link text-white" [routerLink]='["/authentication/register"]'>Registrar</a>
    </li>
    <li class="nav-item">
        <a class="nav-link text-white" [routerLink]='["/authentication/login"]'>Entrar</a>
    </li>
</ul>
