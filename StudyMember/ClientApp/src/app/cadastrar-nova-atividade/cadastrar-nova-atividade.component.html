<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Nova Atividade</title>
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1>Cadastrar Nova Atividade</h1>
    <p>Preencha o formulário abaixo para cadastrar uma nova atividade:</p>

    <form id="registerActivityForm">
      <div class="form-group">
        <label for="nome">Nome da Atividade *</label>
        <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite o nome da atividade" required>
      </div>

      <div class="form-group">
        <label for="dataPrazo">Data de Prazo *</label>
        <input type="date" class="form-control" id="dataPrazo" name="dataPrazo" required>
      </div>

      <div class="form-group">
        <label for="tipoAtividade">Tipo de Atividade *</label>
        <select class="form-control" id="tipoAtividade" name="tipoAtividade" required>
          <option value="prova">Prova</option>
          <option value="atividade">Atividade</option>
          <option value="trabalho">Trabalho</option>
        </select>
      </div>

      <div class="form-group">
        <label for="valor">Valor *</label>
        <input type="number" class="form-control" id="valor" name="valor" placeholder="Digite o valor da atividade" required>
      </div>

      <div class="form-group">
        <label for="dataEntrega">Data de Entrega (opcional)</label>
        <input type="date" class="form-control" id="dataEntrega" name="dataEntrega">
      </div>

      <div class="form-group">
        <label for="notaRecebida">Nota Recebida (opcional)</label>
        <input type="number" class="form-control" id="notaRecebida" name="notaRecebida" placeholder="Digite a nota recebida">
      </div>

      <!-- Botão enviar -->
      <button type="submit" class="btn btn-primary">Cadastrar</button>
    </form>

    <!-- Voltar -->
    <div class="mt-4">
      <a href="index.html" class="btn btn-secondary">Voltar para a Página Inicial</a>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

  <!-- Envio de formulário -->
  <script>
    document.getElementById('registerActivityForm').addEventListener('submit', function (event) {
      event.preventDefault(); 


      var nome = document.getElementById('nome').value;
      var dataPrazo = document.getElementById('dataPrazo').value;
      var tipoAtividade = document.getElementById('tipoAtividade').value;
      var valor = document.getElementById('valor').value;
      var dataEntrega = document.getElementById('dataEntrega').value;
      var notaRecebida = document.getElementById('notaRecebida').value;

      // Exemplo: exibir os valores no console
      console.log('Formulário enviado!');
      console.log('Nome da Atividade:', nome);
      console.log('Data de Prazo:', dataPrazo);
      console.log('Tipo de Atividade:', tipoAtividade);
      console.log('Valor:', valor);
      console.log('Data de Entrega:', dataEntrega);
      console.log('Nota Recebida:', notaRecebida);

      // completar
    });
  </script>
</body>
</html>
