<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disciplina - StudyMember</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-5">
    <!-- Nome da Disciplina -->
    <h1>{{ nomeDisciplina }}</h1>

    <!-- Informações de Status e Nota -->
    <div class="row mt-4">
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Status</h5>
            <p class="card-text">{{ status }}</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Nota Recebida</h5>
            <p class="card-text">{{ notaRecebida }}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabela de Próximas Atividades -->
    <div class="row mt-4">
      <div class="col-md-6">
        <h2>Próximas Atividades</h2>
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Atividade</th>
              <th>Data de Prazo</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let atividade of proximasAtividades">
              <td>{{ atividade.nome }}</td>
              <td>{{ atividade.dataPrazo }}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Tabela de Atividades Concluídas -->
      <div class="col-md-6">
        <h2>Atividades Concluídas</h2>
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Atividade</th>
              <th>Nota Recebida</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let atividade of atividadesConcluidas">
              <td>{{ atividade.nome }}</td>
              <td>{{ atividade.notaRecebida }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>



  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="assets/js/notas.js"></script>
</body>
</html>
