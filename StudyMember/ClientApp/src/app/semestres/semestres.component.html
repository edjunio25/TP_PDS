<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notas - StudyMember</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-5">
    <h1>Semestres</h1>
    <table class="table table-striped">
      <thead>
        <tr>
          <th scope="col">Semestre</th>
          <th class="text-end" scope="col">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let semestre of semestres">
          <td>{{ semestre.ano }}/{{ semestre.semestreReferencia }}</td>
          <td class="text-end">
            <button class="btn btn-primary" >Gerenciar</button>
          </td>
        </tr>
      </tbody>
    </table>
    <p *ngIf="semestres.length === 0">Nenhum semestre encontrado.</p>
    <div class="text-center mt-4">
      <button class="btn btn-primary" id="adicionar-semestre" (click)="navegarParaCadastrarNovoSemestre()">Adicionar Semestre</button>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="assets/js/notas.js"></script>
</body>
</html>
